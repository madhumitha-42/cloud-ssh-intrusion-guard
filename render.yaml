# Render Blueprint — lets Render auto-configure this service.
# On render.com: New -> Blueprint -> point at this repo, and these settings
# are applied automatically. You can also ignore this file entirely and
# configure the same values by hand in the Render dashboard (see README).
services:
  - type: web
    name: cloud-ssh-intrusion-guard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py --non-interactive && gunicorn wsgi:app
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
